name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-init:
    name: Initialize Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}"
          TITLE="${{ github.ref_type == 'tag' && github.ref_name || 'Release v0.1.0' }}"
          gh release view "$TAG" || gh release create "$TAG" \
            --title "$TITLE" \
            --notes "## Neko Forum Desktop Client

          Cliente nativo de escritorio ultra-ligero para [Neko Forum](https://fr.neko-void-linux.online/).
          - **Cero assets embebidos**: Renderiza la URL remota mediante WebView nativo del sistema.
          - **Rendimiento**: Compilado a máxima potencia en perfil \`release\` con LTO, \`opt-level = \"s\"\`, \`codegen-units = 1\` y binario \`strip\`.
          - **Binarios disponibles**: Linux x86_64, Windows x86_64 y macOS ARM64."

  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    needs: release-init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: neko-forum-client-linux-x86_64.tar.gz
            binary_name: neko-forum-client
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: neko-forum-client-windows-x86_64.zip
            binary_name: neko-forum-client.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: neko-forum-client-macos-arm64.tar.gz
            binary_name: neko-forum-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Linux)
        if: runner.os == 'Linux'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Package binary (macOS)
        if: runner.os == 'macOS'
        run: |
          strip target/${{ matrix.target }}/release/${{ matrix.binary_name }}
          tar -czvf ${{ matrix.artifact_name }} -C target/${{ matrix.target }}/release ${{ matrix.binary_name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a ${{ matrix.artifact_name }} ./target/${{ matrix.target }}/release/${{ matrix.binary_name }}

      - name: Upload to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}"
          gh release upload "$TAG" ${{ matrix.artifact_name }} --clobber
